<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — BotDock Cloud</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <a class="brand" href="/index.html"><img src="/assets/images/logo.svg" alt="" width="30" height="30"><span>BotDock Cloud</span></a>
  <div class="auth-card">
    <form id="forgotForm" novalidate>
      <h1>Forgot password</h1>
      <p class="sub">We'll email you a reset link (if an email provider is configured on this deployment).</p>
      <p class="form-error" id="formError" role="alert"></p>
      <div class="field"><label for="email">Account email</label><input class="input" type="email" id="email" autocomplete="email" required></div>
      <button class="btn btn-primary btn-block" id="forgotSubmit" type="submit">Send reset link</button>
    </form>
    <div id="sentPanel" hidden>
      <h1>Check your inbox ✉️</h1>
      <p class="sub">If the address is registered, a reset link is on its way.</p>
      <p class="faint" id="devResetWrap" hidden>Dev helper: <a id="devResetLink" href="#">open reset link</a></p>
      <a class="btn btn-block" href="/login.html">Back to sign in</a>
    </div>
  </div>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/demo.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
