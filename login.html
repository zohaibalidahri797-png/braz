<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — BotDock Cloud</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <a class="brand" href="/index.html"><img src="/assets/images/logo.svg" alt="" width="30" height="30"><span>BotDock Cloud</span></a>
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Sign in to manage your bots.</p>
    <div class="note warn mb-16" id="oauthNote" hidden role="note"></div>
    <p class="form-error" id="formError" role="alert"></p>
    <button class="btn oauth-btn" id="googleBtn" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7C21.8 18.8 23 15.9 23 12.3Z"/><path fill="#34A853" d="M12 23c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.4 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3A11.5 11.5 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.6 13.7a6.9 6.9 0 0 1 0-4.4v-3H1.8a11.5 11.5 0 0 0 0 10.4l3.8-3Z"/><path fill="#EA4335" d="M12 5.6c1.7 0 3.2.6 4.4 1.7L19.7 4A11.5 11.5 0 0 0 1.8 6.3l3.8 3C6.5 7.5 9 5.6 12 5.6Z"/></svg>
      Continue with Google
    </button>
    <button class="btn oauth-btn" id="githubBtn" type="button">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.9 10.9c.6.1.8-.2.8-.5v-2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.4-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17.3 4.9 18.3 5.2 18.3 5.2c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.6.8.5A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"/></svg>
      Continue with GitHub
    </button>
    <div class="divider">or with email</div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required>
        <div class="hint" style="text-align:right"><a href="/forgot-password.html">Forgot password?</a></div>
      </div>
      <button class="btn btn-primary btn-block" id="loginSubmit" type="submit">Sign in</button>
      <button class="btn btn-block mt-16" id="demoBtn" type="button" hidden>Explore the demo workspace</button>
    </form>
    <p class="auth-alt">New to BotDock? <a href="/register.html">Create one free</a></p>
  </div>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/demo.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
