<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose a new password — BotDock Cloud</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <a class="brand" href="/index.html"><img src="/assets/images/logo.svg" alt="" width="30" height="30"><span>BotDock Cloud</span></a>
  <div class="auth-card">
    <form id="resetForm" novalidate>
      <h1>Choose a new password</h1>
      <p class="form-error" id="formError" role="alert"></p>
      <div class="field"><label for="password">New password</label><input class="input" type="password" id="password" autocomplete="new-password" required></div>
      <div class="field"><label for="password2">Repeat new password</label><input class="input" type="password" id="password2" autocomplete="new-password" required></div>
      <button class="btn btn-primary btn-block" type="submit">Update password</button>
    </form>
  </div>
</div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/demo.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/assets/js/auth.js"></script>
</body>
</html>
